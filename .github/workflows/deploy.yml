# Deploys the app to Firebase Hosting + Firestore rules on push to 2608-rls.
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#
#   Secret:
#     FIREBASE_SERVICE_ACCOUNT   Full JSON key of a service account in the
#                                budgetbuddy-9d7da project. Create one at
#                                Google Cloud Console → IAM & Admin → Service
#                                Accounts → Keys → Add key (JSON), and grant it
#                                the "Firebase Admin" role. Paste the entire
#                                JSON file contents as the secret value.
#
#   Variables (the public Firebase web-app config — safe, they ship in the
#   client bundle; stored as Variables so they're easy to read/update):
#     VITE_FIREBASE_API_KEY
#     VITE_FIREBASE_AUTH_DOMAIN
#     VITE_FIREBASE_PROJECT_ID
#     VITE_FIREBASE_STORAGE_BUCKET
#     VITE_FIREBASE_MESSAGING_SENDER_ID
#     VITE_FIREBASE_APP_ID
#     VITE_FIREBASE_VAPID_KEY          (optional — leave empty to disable push)

name: Deploy to Firebase

on:
  push:
    branches: [2608-rls]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: npm run build

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: >-
          npx --yes firebase-tools deploy
          --only hosting,firestore:rules
          --project budgetbuddy-9d7da
          --non-interactive
